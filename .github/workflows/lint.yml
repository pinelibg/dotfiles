---
name: Lint files

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          shellcheck_flags: --external-sources --exclude=SC1090
          pattern: |
            *.sh
            .profile
            .bashrc
            .bash_profile
  lint-vint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run vint
        uses: reviewdog/action-vint@7d853f6a655c6940837973e80c2b63fce67c9c8e # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
  lint-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
  lint-tomlcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tomlcheck
        run: |
          curl -L https://github.com/vmchale/tomlcheck/releases/download/0.1.0.38/tomlcheck-x86_64-unkown-linux-gnu -o /usr/local/bin/tomlcheck
          chmod 755 /usr/local/bin/tomlcheck
      - name: Run tomlcheck
        run: find . -type f -name '*.toml' -printf '%P\n' | xargs -t -I{} -n1 sh -c 'tomlcheck -f {} || echo "::error file={}::Toml lint check failed"'
