# Starship configuration file
# Documentation: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# Based on Pure Prompt preset

format = """
$username\
$hostname\
$directory\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

