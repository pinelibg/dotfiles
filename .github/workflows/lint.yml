---
name: Lint files

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        uses: reviewdog/action-shellcheck@b4ffc0b2a69f857f82b74d1310cd3e62e932f9f7 # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          shellcheck_flags: --external-sources --exclude=SC1090
          pattern: |
            *.sh
            .profile
            .bashrc
            .bash_profile
  lint-vint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run vint
        uses: reviewdog/action-vint@7a0c0a5bc4bc9baaac65cc6d2fbfbc46aeb71246 # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
  lint-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        uses: reviewdog/action-actionlint@78b296370c5c75abca79860e9baa9846e3286a29 # v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
  lint-tomlcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tomlcheck
        run: |
          curl -L https://github.com/vmchale/tomlcheck/releases/download/0.1.0.38/tomlcheck-x86_64-unkown-linux-gnu -o /usr/local/bin/tomlcheck
          chmod 755 /usr/local/bin/tomlcheck
      - name: Run tomlcheck
        run: find . -type f -name '*.toml' -printf '%P\n' | xargs -t -I{} -n1 sh -c 'tomlcheck -f {} || echo "::error file={}::Toml lint check failed"'
